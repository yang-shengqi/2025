<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow, nosnippet, noarchive">
    <title>Yang Shengqi's</title>
    <link rel="icon" href="images/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="pragma" content="no-cache" />

    <style>
        /* ============================================================
         * 新拟物 · 全局变量
         * ============================================================ */
        :root{
            --bg:#e0e5ec;
            --shadow-dark:#b8bcc2;
            --shadow-light:#ffffff;

            --accent:#6d5dfc;
            --accent-2:#35c7b3;
            --accent-3:#f0a44a;

            --text:#333333;
            --text-2:#6b7280;
            --text-3:#9aa3b5;

            --sh-out-xs:2px 2px 4px var(--shadow-dark),-2px -2px 4px var(--shadow-light);
            --sh-out-sm:4px 4px 8px var(--shadow-dark),-4px -4px 8px var(--shadow-light);
            --sh-out:8px 8px 16px var(--shadow-dark),-8px -8px 16px var(--shadow-light);
            --sh-out-lg:12px 12px 24px var(--shadow-dark),-12px -12px 24px var(--shadow-light);
            --sh-hover:2px 2px 4px var(--shadow-dark),-2px -2px 4px var(--shadow-light);
            --sh-in-xs:inset 1px 1px 3px var(--shadow-dark),inset -1px -1px 3px var(--shadow-light);
            --sh-in-sm:inset 3px 3px 6px var(--shadow-dark),inset -3px -3px 6px var(--shadow-light);
            --sh-in:inset 6px 6px 12px var(--shadow-dark),inset -6px -6px 12px var(--shadow-light);

            --r-sm:12px;
            --r-md:16px;
            --r-lg:24px;
            --r-full:999px;

            --t:300ms ease-in-out;

            --font:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",
                   "Segoe UI",Roboto,Helvetica,Arial,
                   "Noto Sans SC","Source Han Sans SC",sans-serif;
            --font-mono:ui-monospace,SFMono-Regular,"SF Mono",
                        Menlo,Consolas,monospace;
        }

        /* ============================================================
         * 重置
         * ============================================================ */
        *,*::before,*::after{ box-sizing:border-box; font-family:var(--font); }
        html,body{ height:100%; margin:0; padding:0; }

        body{
            background:var(--bg);
            color:var(--text);
            font-size:14px;
            line-height:1.7;
            -webkit-font-smoothing:antialiased;
            -moz-osx-font-smoothing:grayscale;
            overflow:hidden;
        }

        /* ============================================================
         * 工具类（脚本依赖，不可删）
         * ============================================================ */
        .hidden{ display:none !important; }

        /* ============================================================
         * 加载屏
         * ============================================================ */
        #staticrypt_loading{
            position:fixed;
            inset:0;
            z-index:100;
            display:grid;
            place-items:center;
            background:var(--bg);
        }
        .spinner{
            width:38px;height:38px;border-radius:50%;
            border:3px solid transparent;
            box-shadow:var(--sh-out-sm);
            background:var(--bg);
            position:relative;
            animation:spin .9s linear infinite;
        }
        .spinner::after{
            content:"";
            position:absolute;
            inset:6px;
            border-radius:50%;
            border:3px solid transparent;
            border-top-color:var(--accent);
            animation:spin .9s linear infinite reverse;
        }
        @keyframes spin{ to{ transform:rotate(360deg); } }

        /* ============================================================
         * 内容容器
         * ============================================================ */
        #staticrypt_content{
            position:relative;
            z-index:1;
            min-height:100%;
            display:grid;
            place-items:center;
            padding:24px;
            animation:fadeUp .6s var(--t) both;
        }
        @keyframes fadeUp{
            from{ opacity:0; transform:translateY(16px); }
            to  { opacity:1; transform:translateY(0); }
        }

        /* ============================================================
         * 登录卡片（新拟物：凸起）
         * ============================================================ */
        .card{
            position:relative;
            width:min(400px,100%);
            padding:40px 36px 32px;
            border-radius:var(--r-lg);
            background:var(--bg);
            box-shadow:var(--sh-out-lg);
        }

        /* ---------- 品牌 ---------- */
        .brand{
            display:flex;
            align-items:center;
            gap:10px;
            margin-bottom:26px;
        }
        .brand .mark{
            width:34px;height:34px;
            border-radius:10px;
            flex:0 0 auto;
            display:grid;
            place-items:center;
            color:#fff;
            font-size:16px;
            font-weight:800;
            line-height:1;
            padding-bottom:1px;
            background:var(--accent);
            box-shadow:var(--sh-out-sm);
        }
        .brand .name{
            font-size:14px;
            font-weight:700;
            letter-spacing:-.01em;
            color:var(--text);
        }

        /* ---------- 标题 ---------- */
        .title{
            position:relative;
            margin:0 0 6px;
            font-size:22px;
            font-weight:800;
            letter-spacing:-.03em;
            color:var(--text);
        }
        .sub{
            margin:0 0 28px;
            font-size:13px;
            color:var(--text-3);
        }

        /* ============================================================
         * 表单
         * ============================================================ */
        .form{ display:flex; flex-direction:column; gap:14px; }

        /* 凹陷输入框 */
        .pwd{
            position:relative;
            border-radius:var(--r-md);
            background:var(--bg);
            box-shadow:var(--sh-in);
            transition:box-shadow var(--t);
        }
        .pwd:focus-within{
            box-shadow:var(--sh-in-xs);
        }
        .pwd input{
            width:100%;
            height:48px;
            padding:0 48px 0 16px;
            border:0;
            outline:0;
            background:transparent;
            color:var(--text);
            font-size:14px;
            font-family:inherit;
            letter-spacing:.02em;
        }
        .pwd input::placeholder{
            color:var(--text-3);
            letter-spacing:0;
        }

        .staticrypt-toggle-password-visibility{
            position:absolute;
            top:50%;
            right:12px;
            width:20px;height:20px;
            padding:0;margin:0;
            transform:translateY(-50%);
            cursor:pointer;
            opacity:.45;
            transition:opacity var(--t),transform var(--t);
            user-select:none;
            /* 让 base64 里的黑色 SVG 变浅灰 */
            filter:invert(60%) sepia(8%) saturate(400%) hue-rotate(180deg);
        }
        .staticrypt-toggle-password-visibility:hover{
            opacity:1;
            transform:translateY(-50%) scale(1.08);
        }
        .staticrypt-toggle-password-visibility:focus-visible{
            opacity:1;
            outline:2px solid var(--accent);
            outline-offset:2px;
            border-radius:4px;
        }

        /* ---------- 记住我 ---------- */
        .remember{
            display:flex;
            align-items:center;
            gap:9px;
            font-size:13px;
            color:var(--text-2);
            cursor:pointer;
            user-select:none;
            padding:2px 0;
        }
        .remember input[type="checkbox"]{
            appearance:none;
            -webkit-appearance:none;
            width:20px;height:20px;
            margin:0;
            flex:0 0 auto;
            border-radius:6px;
            background:var(--bg);
            box-shadow:var(--sh-out-sm);
            cursor:pointer;
            position:relative;
            transition:box-shadow var(--t);
        }
        .remember input[type="checkbox"]:hover{
            box-shadow:var(--sh-hover);
        }
        .remember input[type="checkbox"]:checked{
            box-shadow:var(--sh-in-sm);
        }
        .remember input[type="checkbox"]:checked::after{
            content:"";
            position:absolute;
            left:6px;top:2px;
            width:6px;height:11px;
            border:solid var(--accent);
            border-width:0 2px 2px 0;
            transform:rotate(45deg);
        }

        /* ---------- 提交按钮（新拟物：凸起 → hover 缩小 → active 凹陷） ---------- */
        .submit{
            position:relative;
            height:48px;
            border:0;
            border-radius:var(--r-md);
            background:var(--bg);
            color:var(--text);
            font-family:inherit;
            font-size:14px;
            font-weight:650;
            letter-spacing:.18em;
            cursor:pointer;
            box-shadow:var(--sh-out-sm);
            transition:box-shadow var(--t),color var(--t);
        }
        .submit:hover{
            color:var(--accent);
            box-shadow:var(--sh-hover);
        }
        .submit:active{
            box-shadow:var(--sh-in-sm);
        }
        .submit:focus-visible{
            outline:2px solid var(--accent);
            outline-offset:3px;
        }
        .submit span{ position:relative; z-index:1; }

        /* ============================================================
         * 页脚 + 运行时长
         * ============================================================ */
        .foot{
            margin-top:24px;
            padding-top:18px;
            border-top:1px solid rgba(184,188,194,.35);
            text-align:center;
            font-size:11.5px;
            letter-spacing:.06em;
            color:var(--text-3);
        }
        .foot .timer{
            display:block;
            margin-bottom:6px;
            font-family:var(--font-mono);
            font-size:13px;
            font-weight:700;
            letter-spacing:.02em;
            color:var(--text-2);
        }
        .foot .timer #display{
            color:var(--accent);
            font-variant-numeric:tabular-nums;
        }

        /* ============================================================
         * 响应式
         * ============================================================ */
        @media (max-width:480px){
            #staticrypt_content{ padding:16px; }
            .card{ padding:32px 24px 26px; }
            .title{ font-size:20px; }
        }

        /* ============================================================
         * 无障碍：减少动效
         * ============================================================ */
        @media (prefers-reduced-motion: reduce){
            *,*::before,*::after{
                animation-duration:.01ms !important;
                transition-duration:.01ms !important;
            }
        }
    </style>
</head>

    <script>
    /* 运行时长（新拟物模板保留） */
    (function(){
      'use strict';

      var startDate = new Date(2015, 0, 1, 0, 0, 0);  // 2015-01-01
      var display = document.getElementById('display');
      if (!display) return;

      function pad(n){ return String(n).padStart(2, '0'); }

      function format(ms){
        var s = Math.floor(ms / 1000);
        var d = Math.floor(s / 86400);
        var h = Math.floor((s % 86400) / 3600);
        var m = Math.floor((s % 3600) / 60);
        var ss = s % 60;
        return d + 'D ' + pad(h) + ':' + pad(m) + ':' + pad(ss);
      }

      function render(){
        display.textContent = format(Date.now() - startDate.getTime());
      }

      render();
      setInterval(render, 1000);
    })();
    </script>
